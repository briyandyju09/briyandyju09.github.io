<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Page not found · The Briyan Archive</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <script>
    try {
      var t = localStorage.getItem('archive-theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <link rel="preload" href="/fonts/bricolage-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/tokens.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html { height: 100%; }
    body {
      margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; overflow: hidden;
      font: 400 16px/24px var(--font-sans); color: var(--text);
      background: linear-gradient(var(--ground), var(--ground-deep)) fixed;
    }
    .bubble {
      position: fixed; border-radius: 50%; border: var(--stroke-lg) solid var(--ink); pointer-events: none;
    }
    .bubble::after {
      content: ""; position: absolute; left: 18%; top: 14%; width: 34%; height: 22%;
      border-radius: 50%; background: #ffffffb3; transform: rotate(-25deg);
    }
    .b1 { width: 260px; height: 260px; right: -70px; top: -60px; background: var(--orange); }
    .b2 { width: 200px; height: 200px; left: -60px; bottom: -50px; background: var(--teal); }
    .b3 { width: 90px; height: 90px; right: 14%; bottom: 10%; background: var(--yellow); }
    main {
      position: relative; width: min(440px, 100%);
      background: var(--surface); color: var(--ink);
      border: var(--stroke-md) solid var(--ink); border-radius: var(--radius-lg);
      box-shadow: var(--shadow-pop-lg); padding: var(--space-5) var(--space-5) var(--space-6);
      transform: rotate(var(--tilt-1));
    }
    .code {
      display: inline-block; margin: 0 0 var(--space-4); padding: 4px 12px;
      font: 800 14px/16px var(--font-display); letter-spacing: -0.02em;
      background: var(--lime); border: var(--stroke-sm) solid var(--ink); border-radius: 999px; box-shadow: 2px 2px 0 var(--ink);
    }
    h1 {
      font: 800 56px/52px var(--font-display); letter-spacing: -0.03em; margin: 0 0 var(--space-3); text-wrap: balance;
    }
    .marker {
      background: var(--yellow); padding: 0 .12em; border-radius: var(--radius-sm);
      -webkit-box-decoration-break: clone; box-decoration-break: clone;
    }
    p { margin: 0 0 var(--space-5); color: var(--ink-muted); max-width: 40ch; }
    a.btn {
      display: inline-block; font: 800 18px/18px var(--font-display); letter-spacing: -0.02em; text-transform: lowercase;
      color: var(--ink); text-decoration: none; padding: 12px 24px;
      background: var(--lime); border: var(--stroke-md) solid var(--ink); border-radius: 999px; box-shadow: var(--shadow-pop);
      transition: transform 100ms ease-out, box-shadow 100ms ease-out;
    }
    a.btn:active { transform: translate(4px, 4px); box-shadow: none; }
    a.btn:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
    @media (prefers-reduced-motion: reduce) { a.btn { transition: none; } }
  </style>
</head>
<body>
  <i class="bubble b1" aria-hidden="true"></i><i class="bubble b2" aria-hidden="true"></i><i class="bubble b3" aria-hidden="true"></i>
  <main>
    <p class="code">404</p>
    <h1>Nothing <span class="marker">here</span></h1>
    <p>that page doesn’t exist, or it moved. the archive has everything that’s left.</p>
    <a class="btn" href="/">back to the archive</a>
  </main>
</body>
</html>
