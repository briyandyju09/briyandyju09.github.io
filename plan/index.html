<link rel="stylesheet" href="plan.css">
<script>
/* apply saved look before first paint so nothing flashes */
try {
  var s = (JSON.parse(localStorage.getItem("plan.v1") || "{}").settings) || {}, d = document.documentElement;
  d.dataset.theme = s.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  if (s.large) d.dataset.large = "";
  if (s.contrast) d.dataset.contrast = "";
  if (s.calm === true || (s.calm == null && matchMedia("(prefers-reduced-motion: reduce)").matches)) d.dataset.calm = "";
} catch (e) { document.documentElement.dataset.theme = "light"; }
</script>
</head>
<body>

<footer class="foot">Your ticks, notes and timers live only in this browser. Use <b>tools → back up</b> to move them to another device. Made for PT2, Nov 16–27 2026.</footer>
